name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # 100% line and branch coverage of profy/ and scripts/ is enforced by
      # [tool.coverage.report] fail_under in pyproject.toml.
      - run: python -m pytest --cov --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: python -m venv /tmp/profy-venv
      - run: /tmp/profy-venv/bin/python -m pip install dist/profy_filter-*.whl
      - run: |
          cd /tmp
          /tmp/profy-venv/bin/python - <<'PY'
          from profy import filter_text

          result = filter_text("Das ist scheisse", languages="german")
          assert result.clean == "Das ist ********"
          assert filter_text("Scunthorpe").is_clean
          PY
