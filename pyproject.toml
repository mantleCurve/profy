[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "profy-filter"
version = "0.2.0"
description = "A Python profanity filter forked from Blaspsoft/blasp."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "MantleCurve" }]
keywords = ["profanity", "filter", "moderation", "text-cleaning", "blasp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Filters",
]

[project.urls]
Homepage = "https://github.com/mantleCurve/profy"
Repository = "https://github.com/mantleCurve/profy"
Issues = "https://github.com/mantleCurve/profy/issues"
Changelog = "https://github.com/mantleCurve/profy/blob/main/CHANGELOG.md"
Upstream = "https://github.com/Blaspsoft/blasp"

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["profy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["profy", "scripts"]

[tool.coverage.report]
fail_under = 100
show_missing = true
